<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumkun - Business Manager</title>
<style>
:root{
  --bg:#FAF6F1;
  --surface:#FFFFFF;
  --teal:#1B4B4A;
  --teal-light:#2F6B69;
  --teal-dark:#123534;
  --rose:#C4707A;
  --gold:#B8935A;
  --ink:#2A2521;
  --ink-soft:#786C62;
  --sand:#F1E7DA;
  --line:#E4D8C8;
  --success:#4C7A5C;
  --danger:#B24C4C;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:sans-serif;min-height:100vh;}
.app{display:flex;min-height:100vh;}

.sidebar{width:250px;flex-shrink:0;background:var(--teal);color:#F4EEE4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:26px 22px 18px;border-bottom:1px solid rgba(244,238,228,0.15);}
.brand-name{font-size:32px;font-weight:700;color:#F4EEE4;margin:0;line-height:1;}
.brand-sub{margin:8px 0 0;font-size:12px;color:#C9BFA9;}
nav{flex:1;padding:14px 12px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius);color:#DCD3C2;cursor:pointer;font-size:15px;margin-bottom:4px;transition:background .15s;}
.nav-item:hover{background:rgba(244,238,228,0.08);}
.nav-item.active{background:var(--teal-dark);color:#F4EEE4;border-left:3px solid var(--gold);padding-left:9px;}
.sidebar-footer{padding:14px 20px 18px;font-size:12px;color:#9EAFA9;border-top:1px solid rgba(244,238,228,0.12);}

main{flex:1;padding:28px 34px;max-width:1200px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:26px;margin:0;color:var(--teal-dark);}
.page-desc{color:var(--ink-soft);font-size:13px;margin:4px 0 0;}

.btn{border:none;border-radius:var(--radius);padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-gold{background:var(--gold);color:#3A2C12;}
.btn-outline{background:transparent;color:var(--teal);border:1.5px solid var(--teal);}
.btn-danger-text{background:transparent;color:var(--danger);border:none;padding:6px 8px;font-weight:500;cursor:pointer;}
.btn-edit-text{background:transparent;color:var(--teal-light);border:none;padding:6px 8px;font-weight:500;cursor:pointer;}
.btn-small{padding:6px 12px;font-size:13px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);border-top:3px solid var(--gold);padding:20px 22px;margin-bottom:20px;}
.card h3{margin:0 0 14px;font-size:17px;color:var(--teal-dark);font-weight:700;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:var(--radius);padding:18px 20px;}
.stat-card.rose{border-top-color:var(--rose);}
.stat-card.gold{border-top-color:var(--gold);}
.stat-label{font-size:13px;color:var(--ink-soft);margin:0 0 8px;}
.stat-value{font-size:24px;font-weight:700;color:var(--teal-dark);margin:0;}
.stat-value.neg{color:var(--danger);}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
thead th{background:var(--teal);color:#F4EEE4;text-align:left;padding:11px 12px;font-weight:500;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:nth-child(even){background:var(--sand);}
tbody tr:hover{background:#EFE2CE;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:26px;}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:rgba(27,75,74,0.1);color:var(--teal-dark);}
.tag.warn{background:rgba(178,76,76,0.12);color:var(--danger);}

.overlay{position:fixed;inset:0;background:rgba(20,20,18,0.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);border-top:4px solid var(--gold);width:100%;max-width:480px;padding:24px 26px 26px;}
.modal h3{margin:0 0 18px;color:var(--teal-dark);font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13.5px;margin-bottom:6px;color:var(--ink-soft);}
.field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.inline-field{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.inline-field label{flex-shrink:0;font-size:14px;color:var(--ink-soft);min-width:220px;}
.inline-field input{padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;max-width:180px;}
.helper-text{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}

#loading{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;font-size:22px;color:var(--teal);flex-direction:column;gap:15px;}

@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;}
  nav{display:flex;overflow-x:auto;padding:8px;gap:4px;}
  .nav-item{flex-shrink:0;padding:9px 12px;}
  .nav-item.active{border-left:none;border-bottom:3px solid var(--gold);}
  main{padding:20px 16px;}
}
</style>
</head>
<body>

<div id="loading">Starting Mumkun Portal...</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <p class="brand-name">Mumkun</p>
      <p class="brand-sub">Purchases, sales and shipping manager</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer" id="saveStatus">Saved automatically</div>
  </aside>
  <main id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
var db = {
  meta: { exchangeRateTRYtoEGP: 1.5 },
  suppliers: [],
  products: [],
  weightTiers: [],
  shippingRates: { turkeyToEgyptPerKgTRY: 0 },
  egyptCities: [],
  purchases: [],
  sales: []
};

var currentTab = "dashboard";
var editing = { type: null, id: null };
var STORAGE_KEY = "mumkun_data";

var SCHEMAS = {
  suppliers: { title: "Supplier", fields: [
    {key: "name", label: "Supplier name", type: "text", required: true},
    {key: "phone", label: "Phone number", type: "text"},
    {key: "city", label: "City in Turkey", type: "text"},
    {key: "notes", label: "Notes", type: "textarea"}
  ]},
  products: { title: "Product", fields: [
    {key: "name", label: "Product name", type: "text", required: true},
    {key: "category", label: "Category", type: "select", options: ["Skincare", "Clothing", "Accessories", "Other"]},
    {key: "supplierId", label: "Supplier", type: "ref", ref: "suppliers"},
    {key: "unitWeightKg", label: "Weight per piece (kg)", type: "number", step: "0.01", required: true},
    {key: "salePriceEGP", label: "Suggested sale price per piece (EGP)", type: "number", step: "0.01"},
    {key: "notes", label: "Notes", type: "textarea"}
  ]},
  weightTiers: { title: "Weight tier", fields: [
    {key: "label", label: "Tier name", type: "text", required: true},
    {key: "minKg", label: "From weight (kg)", type: "number", step: "0.01", required: true},
    {key: "maxKg", label: "To weight (kg)", type: "number", step: "0.01", required: true},
    {key: "pricePerKgTRY", label: "Price per kg - internal shipping (TRY)", type: "number", step: "0.01", required: true}
  ]},
  egyptCities: { title: "Delivery city", fields: [
    {key: "city", label: "City", type: "text", required: true},
    {key: "priceEGP", label: "Actual delivery cost (EGP)", type: "number", step: "0.01", required: true}
  ]},
  purchases: { title: "Purchase", fields: [
    {key: "date", label: "Date", type: "date", required: true},
    {key: "supplierId", label: "Supplier", type: "ref", ref: "suppliers", required: true},
    {key: "productId", label: "Product", type: "ref", ref: "products", required: true},
    {key: "qty", label: "Quantity (pieces)", type: "number", step: "1", required: true},
    {key: "unitPriceTRY", label: "Purchase price per piece (TRY)", type: "number", step: "0.01", required: true},
    {key: "notes", label: "Notes", type: "textarea"}
  ]},
  sales: { title: "Sale", fields: [
    {key: "date", label: "Date", type: "date", required: true},
    {key: "customerName", label: "Customer name", type: "text", required: true},
    {key: "phone", label: "Phone number", type: "text"},
    {key: "productId", label: "Product", type: "ref", ref: "products", required: true},
    {key: "qty", label: "Quantity", type: "number", step: "1", required: true},
    {key: "unitPriceEGP", label: "Sale price per piece (EGP)", type: "number", step: "0.01", required: true},
    {key: "cityId", label: "Delivery city", type: "ref", ref: "egyptCities", required: true},
    {key: "deliveryChargedEGP", label: "Delivery charged to customer (EGP)", type: "number", step: "0.01"},
    {key: "notes", label: "Notes", type: "textarea"}
  ]}
};

var TABS = [
  {id: "dashboard", label: "Dashboard"},
  {id: "suppliers", label: "Suppliers"},
  {id: "products", label: "Products"},
  {id: "purchases", label: "Purchases"},
  {id: "sales", label: "Sales"},
  {id: "shipping", label: "Shipping & Pricing"},
  {id: "settings", label: "Settings & Backup"}
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function loadDB(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed === "object"){
        for(var key in parsed){ db[key] = parsed[key]; }
      }
    }
  } catch(e) {
    console.warn("Storage restricted, using session memory");
  }
}

function saveDB(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    var el = document.getElementById("saveStatus");
    if(el) el.textContent = "Saved automatically";
  } catch(e) {
    var elErr = document.getElementById("saveStatus");
    if(elErr) elErr.textContent = "Backup to JSON recommended";
  }
}

function fmt(n, decimals){
  if(n === null || n === undefined || isNaN(n)) return "-";
  var d = decimals !== undefined ? decimals : 2;
  return Number(n).toFixed(d);
}

function refLabel(ref, id){
  var arr = db[ref] || [];
  for(var i = 0; i < arr.length; i++){
    if(arr[i].id === id){
      return arr[i].name || arr[i].city || "-";
    }
  }
  return "-";
}

function findTier(weightKg){
  for(var i = 0; i < db.weightTiers.length; i++){
    var t = db.weightTiers[i];
    if(weightKg >= parseFloat(t.minKg) && weightKg <= parseFloat(t.maxKg)){
      return t;
    }
  }
  return null;
}

function computePurchase(p){
  var product = null;
  for(var i = 0; i < db.products.length; i++){
    if(db.products[i].id === p.productId){ product = db.products[i]; break; }
  }
  var qty = parseFloat(p.qty) || 0;
  var unitWeight = product ? (parseFloat(product.unitWeightKg) || 0) : 0;
  var totalWeight = qty * unitWeight;
  var tier = findTier(unitWeight);
  var internalRate = tier ? (parseFloat(tier.pricePerKgTRY) || 0) : 0;
  var internalCostTRY = totalWeight * internalRate;
  var intlRate = parseFloat(db.shippingRates.turkeyToEgyptPerKgTRY) || 0;
  var intlCostTRY = totalWeight * intlRate;
  var productCostTRY = qty * (parseFloat(p.unitPriceTRY) || 0);
  var totalCostTRY = productCostTRY + internalCostTRY + intlCostTRY;
  var rate = parseFloat(db.meta.exchangeRateTRYtoEGP) || 0;
  var totalCostEGP = totalCostTRY * rate;
  var unitCostEGP = qty > 0 ? (totalCostEGP / qty) : 0;
  return {
    product: product,
    qty: qty,
    tier: tier,
    internalCostTRY: internalCostTRY,
    intlCostTRY: intlCostTRY,
    totalCostEGP: totalCostEGP,
    unitCostEGP: unitCostEGP
  };
}

function getProductAvgCostEGP(productId){
  var totalQty = 0;
  var totalCost = 0;
  for(var i = 0; i < db.purchases.length; i++){
    if(db.purchases[i].productId === productId){
      var c = computePurchase(db.purchases[i]);
      totalQty += c.qty;
      totalCost += c.totalCostEGP;
    }
  }
  return totalQty > 0 ? (totalCost / totalQty) : null;
}

function getProductStock(productId){
  var bought = 0;
  var sold = 0;
  for(var i = 0; i < db.purchases.length; i++){
    if(db.purchases[i].productId === productId) bought += (parseFloat(db.purchases[i].qty) || 0);
  }
  for(var j = 0; j < db.sales.length; j++){
    if(db.sales[j].productId === productId) sold += (parseFloat(db.sales[j].qty) || 0);
  }
  return bought - sold;
}

function computeSale(s){
  var product = null;
  for(var i = 0; i < db.products.length; i++){
    if(db.products[i].id === s.productId){ product = db.products[i]; break; }
  }
  var city = null;
  for(var j = 0; j < db.egyptCities.length; j++){
    if(db.egyptCities[j].id === s.cityId){ city = db.egyptCities[j]; break; }
  }
  var qty = parseFloat(s.qty) || 0;
  var revenue = qty * (parseFloat(s.unitPriceEGP) || 0) + (parseFloat(s.deliveryChargedEGP) || 0);
  var avgCost = getProductAvgCostEGP(s.productId);
  var cogs = avgCost !== null ? (avgCost * qty) : null;
  var deliveryCost = city ? (parseFloat(city.priceEGP) || 0) : 0;
  var profit = cogs !== null ? (revenue - cogs - deliveryCost) : null;
  return { product: product, city: city, qty: qty, revenue: revenue, profit: profit, deliveryCost: deliveryCost };
}

function renderNav(){
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  for(var i = 0; i < TABS.length; i++){
    (function(tab){
      var div = document.createElement("div");
      div.className = "nav-item" + (tab.id === currentTab ? " active" : "");
      div.textContent = tab.label;
      div.onclick = function(){
        currentTab = tab.id;
        renderNav();
        renderMain();
      };
      nav.appendChild(div);
    })(TABS[i]);
  }
}

function openModal(type, id){
  editing = { type: type, id: id };
  var schema = SCHEMAS[type];
  var record = {};
  if(id){
    for(var i = 0; i < db[type].length; i++){
      if(db[type][i].id === id){ record = db[type][i]; break; }
    }
  }
  var box = document.getElementById("modalBox");
  box.innerHTML = "<h3>" + (id ? "Edit " : "Add ") + schema.title + "</h3><div id='formFields'></div>" +
    "<div class='modal-actions'>" +
      "<button class='btn btn-outline' id='cancelBtn'>Cancel</button>" +
      "<button class='btn btn-primary' id='saveBtn'>Save</button>" +
    "</div>";

  var fieldsEl = box.querySelector("#formFields");
  for(var f = 0; f < schema.fields.length; f++){
    var field = schema.fields[f];
    var val = record[field.key] !== undefined ? record[field.key] : "";
    var wrap = document.createElement("div");
    wrap.className = "field";
    var lbl = document.createElement("label");
    lbl.textContent = field.label;
    wrap.appendChild(lbl);

    if(field.type === "textarea"){
      var txt = document.createElement("textarea");
      txt.setAttribute("data-key", field.key);
      txt.value = val;
      wrap.appendChild(txt);
    } else if(field.type === "select"){
      var sel = document.createElement("select");
      sel.setAttribute("data-key", field.key);
      sel.innerHTML = "<option value=''>- Select -</option>";
      for(var o = 0; o < field.options.length; o++){
        var opt = document.createElement("option");
        opt.value = field.options[o];
        opt.textContent = field.options[o];
        if(val === field.options[o]) opt.selected = true;
        sel.appendChild(opt);
      }
      wrap.appendChild(sel);
    } else if(field.type === "ref"){
      var selRef = document.createElement("select");
      selRef.setAttribute("data-key", field.key);
      selRef.innerHTML = "<option value=''>- Select -</option>";
      var refList = db[field.ref] || [];
      for(var r = 0; r < refList.length; r++){
        var optRef = document.createElement("option");
        optRef.value = refList[r].id;
        optRef.textContent = refList[r].name || refList[r].city || refList[r].label;
        if(val === refList[r].id) optRef.selected = true;
        selRef.appendChild(optRef);
      }
      wrap.appendChild(selRef);
    } else {
      var inp = document.createElement("input");
      inp.type = field.type;
      if(field.step) inp.step = field.step;
      inp.setAttribute("data-key", field.key);
      inp.value = val;
      wrap.appendChild(inp);
    }
    fieldsEl.appendChild(wrap);
  }

  box.querySelector("#cancelBtn").onclick = closeModal;
  box.querySelector("#saveBtn").onclick = function(){ submitForm(type, id); };
  document.getElementById("overlay").className = "overlay show";
}

function closeModal(){
  document.getElementById("overlay").className = "overlay";
  editing = { type: null, id: null };
}

function submitForm(type, id){
  var schema = SCHEMAS[type];
  var box = document.getElementById("modalBox");
  var data = {};
  var missing = false;
  for(var i = 0; i < schema.fields.length; i++){
    var field = schema.fields[i];
    var el = box.querySelector("[data-key='" + field.key + "']");
    var v = el ? el.value : "";
    if(field.required && !v){
      missing = true;
      if(el) el.style.borderColor = "var(--danger)";
    }
    data[field.key] = v;
  }
  if(missing) return;
  if(id){
    for(var j = 0; j < db[type].length; j++){
      if(db[type][j].id === id){
        for(var k in data){ db[type][j][k] = data[k]; }
        break;
      }
    }
  } else {
    data.id = uid();
    db[type].push(data);
  }
  saveDB();
  closeModal();
  renderMain();
}

function deleteRecord(type, id){
  if(!confirm("Delete this record?")) return;
  var next = [];
  for(var i = 0; i < db[type].length; i++){
    if(db[type][i].id !== id) next.push(db[type][i]);
  }
  db[type] = next;
  saveDB();
  renderMain();
}

function renderMain(){
  var main = document.getElementById("main");
  main.innerHTML = "";

  if(currentTab === "dashboard"){
    renderDashboard(main);
  } else if(currentTab === "suppliers"){
    renderSimpleTable(main, "suppliers", "Suppliers", "Registered suppliers in Turkey", [
      {h: "Name", k: "name"}, {h: "Phone", k: "phone"}, {h: "City", k: "city"}, {h: "Notes", k: "notes"}
    ]);
  } else if(currentTab === "products"){
    renderProducts(main);
  } else if(currentTab === "purchases"){
    renderPurchases(main);
  } else if(currentTab === "sales"){
    renderSales(main);
  } else if(currentTab === "shipping"){
    renderShipping(main);
  } else if(currentTab === "settings"){
    renderSettings(main);
  }
}

function renderDashboard(main){
  var totalRevenue = 0;
  var totalPurchaseCost = 0;
  var totalProfit = 0;
  for(var s = 0; s < db.sales.length; s++){
    var sc = computeSale(db.sales[s]);
    totalRevenue += sc.revenue;
    if(sc.profit !== null) totalProfit += sc.profit;
  }
  for(var p = 0; p < db.purchases.length; p++){
    totalPurchaseCost += computePurchase(db.purchases[p]).totalCostEGP;
  }
  var inventoryValue = 0;
  for(var pr = 0; pr < db.products.length; pr++){
    var st = getProductStock(db.products[pr].id);
    var avg = getProductAvgCostEGP(db.products[pr].id) || 0;
    if(st > 0) inventoryValue += (st * avg);
  }

  main.innerHTML = "<div class='page-header'><div><h2 class='page-title'>Dashboard</h2>" +
    "<p class='page-desc'>Performance overview</p></div></div>" +
    "<div class='stat-grid'>" +
      "<div class='stat-card'><p class='stat-label'>Total Revenue</p><p class='stat-value'>" + fmt(totalRevenue, 2) + " EGP</p></div>" +
      "<div class='stat-card rose'><p class='stat-label'>Total Costs</p><p class='stat-value'>" + fmt(totalPurchaseCost, 2) + " EGP</p></div>" +
      "<div class='stat-card gold'><p class='stat-label'>Estimated Net Profit</p><p class='stat-value" + (totalProfit < 0 ? " neg" : "") + "'>" + fmt(totalProfit, 2) + " EGP</p></div>" +
      "<div class='stat-card'><p class='stat-label'>Inventory Value</p><p class='stat-value'>" + fmt(inventoryValue, 2) + " EGP</p></div>" +
    "</div>";
}

function renderSimpleTable(main, type, title, desc, cols){
  var header = "<div class='page-header'><div><h2 class='page-title'>" + title + "</h2>" +
    "<p class='page-desc'>" + desc + "</p></div>" +
    "<button class='btn btn-primary' id='addBtn'>+ Add " + SCHEMAS[type].title + "</button></div>";

  var ths = "";
  for(var c = 0; c < cols.length; c++) ths += "<th>" + cols[c].h + "</th>";
  ths += "<th></th>";

  var rows = "";
  if(db[type].length === 0){
    rows = "<tr class='empty-row'><td colspan='" + (cols.length + 1) + "'>No records yet.</td></tr>";
  } else {
    for(var i = 0; i < db[type].length; i++){
      var r = db[type][i];
      rows += "<tr>";
      for(var k = 0; k < cols.length; k++) rows += "<td>" + (r[cols[k].k] || "-") + "</td>";
      rows += "<td><button class='btn-edit-text' data-id='" + r.id + "'>Edit</button>" +
              "<button class='btn-danger-text' data-del='" + r.id + "'>Delete</button></td></tr>";
    }
  }

function renderSettings(main){
  main.innerHTML = "<div class='page-header'><div><h2 class='page-title'>Settings & Backup</h2>" +
    "<p class='page-desc'>Currency rate and cross-device sync</p></div></div>" +
    "<div class='card'>" +
      "<h3>Currency Exchange</h3>" +
      "<div class='inline-field'><label>TRY to EGP Exchange Rate</label><input type='number' step='0.0001' id='fxRate' value='" + (db.meta.exchangeRateTRYtoEGP || 1.5) + "'></div>" +
      "<button class='btn btn-primary btn-small' id='saveFxBtn'>Save Exchange Rate</button>" +
    "</div>" +
    "<div class='card'>" +
      "<h3>Cross-Device Sync & Data Backup</h3>" +
      "<p class='helper-text'>Export your backup JSON file to load your business data on your phone or other browsers.</p>" +
      "<div style='display:flex; gap:12px; margin-top:14px;'>" +
        "<button class='btn btn-outline' id='exportJsonBtn'>Export System Backup</button>" +
        "<label for='importJson' class='btn btn-outline' style='cursor:pointer;'>Restore System Backup</label>" +
        "<input type='file' id='importJson' accept='.json' style='display:none;'>" +
      "</div>" +
    "</div>";

  main.querySelector("#saveFxBtn").onclick = function(){
    db.meta.exchangeRateTRYtoEGP = parseFloat(main.querySelector("#fxRate").value) || 1.5;
    saveDB();
    renderMain();
  };

  main.querySelector("#exportJsonBtn").onclick = function(){
    var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "Mumkun_Backup_" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  main.querySelector("#importJson").onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var imported = JSON.parse(evt.target.result);
        if(imported && imported.meta){
          db = imported;
          saveDB();
          alert("Backup restored successfully!");
          renderMain();
        } else {
          alert("Invalid backup file structure.");
        }
      } catch(err){
        alert("Failed to parse JSON backup.");
      }
    };
    reader.readAsText(file);
  };
}

function init(){
  loadDB();
  var lEl = document.getElementById("loading");
  if(lEl) lEl.style.display = "none";
  var appEl = document.getElementById("app");
  if(appEl) appEl.style.display = "flex";
  renderNav();
  renderMain();
}

window.onload = init;
</script>
